server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The dashboard holds a business's draft customer messages; keep it out of
  # caches and out of other people's frames.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; index.html must never be cached or a sign-in
  # redirect can be served from a stale bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The worker must be re-fetched or an old one keeps serving the old shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A photo off a phone camera. Smaller than this and an upload fails at
    # nginx with a 413 the dashboard cannot explain.
    client_max_body_size 10m;
  }

  # Product photos. Open on purpose: Shopee, Lazada and TikTok Shop fetch the
  # image themselves while building a listing, and they hold no session here.
  # The filename is random, which is the only thing guarding it.
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Meta (and any other platform calling in) must reach n8n's webhooks, but
  # never its editor. Only /webhook/ and /webhook-test/ are proxied through.
  location /n8n-webhook/ {
    proxy_pass http://n8n:5678/webhook/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    client_max_body_size 8m;
  }

  # Socket.io needs the upgrade headers or it falls back to polling forever.
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }
}
