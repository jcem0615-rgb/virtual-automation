# Every published port is bound to 127.0.0.1 on purpose: the dashboard and its
# API have no login yet. Do not widen these until auth exists.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office}
      POSTGRES_DB: virtual_office
    # Runs alphabetically on an empty volume: schema.sql, then seed.sql.
    # It does NOT re-run on an existing volume — see the README.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d virtual_office"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      # Referenced by the workflow exports as $env.*
      BACKEND_URL: http://backend:4000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      # The Messenger workflow verifies Meta's signature in a Code node.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Meta / Instagram. Empty until you connect a page — see the README.
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_BUSINESS_CODE: ${META_BUSINESS_CODE:-BIZ_ELEC}
      META_PAGE_ID: ${META_PAGE_ID:-}
      # Shopee Open Platform. SHOPEE_HOST switches region or sandbox.
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_SHOP_ID: ${SHOPEE_SHOP_ID:-}
      SHOPEE_ACCESS_TOKEN: ${SHOPEE_ACCESS_TOKEN:-}
      SHOPEE_HOST: ${SHOPEE_HOST:-https://partner.shopeemobile.com}
      # TikTok Content Posting API.
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_PRIVACY_LEVEL: ${TIKTOK_PRIVACY_LEVEL:-PUBLIC_TO_EVERYONE}
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - backend
      - ollama

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://office:${POSTGRES_PASSWORD:-office}@postgres:5432/virtual_office
      PORT: 4000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      N8N_RETRY_WEBHOOK_URL: http://n8n:5678/webhook/sales-lead
      N8N_DISPATCH_WEBHOOK_URL: http://n8n:5678/webhook/approval-dispatch
      N8N_POST_SYNC_WEBHOOK_URL: http://n8n:5678/webhook/post-sync
      N8N_PRODUCT_SYNC_WEBHOOK_URL: http://n8n:5678/webhook/product-sync
      # 32 bytes, base64 or hex. Marketplace credentials are encrypted with it,
      # so losing it means reconnecting every seller account.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      # Local development runs over http, so the session cookie cannot be
      # Secure here. docker-compose.prod.yml turns it back on.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:
  n8ndata:
